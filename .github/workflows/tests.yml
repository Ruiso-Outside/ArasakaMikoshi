# Testes automáticos: rodam a cada push e pull request e antes do instalador de cada Release (o Release não sai
# se falharem). Servidor com motor falso, sem GPU; o setor Sprites usa um stable-diffusion.cpp e um Construct falsos.
# Windows (app desktop) e Linux (módulo da Arasaka Central no Zorin OS).
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14"]
        include:
          # o app aceita o Python 3.10 ou mais novo (desktop/main.js e module/backend.js); confere que ainda roda nele
          - os: ubuntu-latest
            python: "3.10"
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sintaxe do JavaScript
        shell: bash
        run: |
          for f in app/web/*.js desktop/*.js desktop/scripts/*.js desktop/test/*.js; do node --check "$f"; done
          # scripts embutidos no HTML
          python - <<'EOF'
          import re, subprocess, pathlib, tempfile
          for html in pathlib.Path("app/web").glob("*.html"):
              for i, js in enumerate(re.findall(r"<script>([\s\S]*?)</script>", html.read_text("utf-8"))):
                  f = pathlib.Path(tempfile.gettempdir()) / f"{html.stem}_{i}.js"
                  f.write_text(js, "utf-8")
                  subprocess.run(["node", "--check", str(f)], check=True)
          EOF

      - name: Compilação do Python
        shell: bash
        run: python -m compileall -q app tests

      - name: Testes
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Testes do atualizador (Node)
        shell: bash
        run: node --test desktop/test/*.test.js

      - name: Electron (para o teste da interface)
        working-directory: desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js

      - name: Teste da interface (Electron, servidor e motor falsos)
        working-directory: desktop
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npx electron test/ui-smoke.js; else npx electron test/ui-smoke.js; fi
